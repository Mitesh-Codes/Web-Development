<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body,html{
            height: 100%;
            font-family: Georgia, 'Times New Roman', Times, serif;
            margin: 0px;
            padding: 0px;
            border: none;
        }   
        .container{
            background:linear-gradient(135deg, rgb(53, 107, 199), rgb(110, 30, 110));
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        /* .content{
            background: linear-gradient(90deg,rgb(255, 254, 254),rgb(249, 246, 246));
            border-radius: 10px;
            padding: 30px;
            
        } */
        .content {
            position: relative;
            padding: 30px;
            border-radius: 24px;
            background: #ffffff;
            border: 5px solid transparent;
            background:
                linear-gradient(#ffffff, #ffffff) padding-box,
                linear-gradient(135deg, #6366f1, #ec4899, #f59e0b) border-box;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);
            transition: 0.4s ease;
        }

        .content:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.3);
        }
        #pantIcon{
            mix-blend-mode: multiply;
            width:250px;
            border-radius: 5px;
            object-fit: contain;
            height: 300px;
        }
        h1{
            width: 100px;
            color: black;
            background-color: #fff;
            justify-content: center;
            align-items: center;
            margin-left: 70px;
            padding-left: 10px;
            border-radius: 2px;
            background: linear-gradient(90deg, rgb(212, 45, 27), rgb(244, 238, 238));
            border-color: black;
            border: 3px solid;
        }
        h1 a{
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        h4{
            background-color: rgb(242, 247, 250);
            padding: 5px 10px;
            width:fit-content;
            margin-left: 40px;
        }
        button{
            padding:0.4rem;
            /* margin-right: 60px; */
            background:linear-gradient(300deg, #8a2be2, #4169e1);
            color:rgb(252, 246, 246);
            border:none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.7s ease-in-out;
            
            
            
        }
        button:hover{
            background:linear-gradient(60deg, #8a2be2,#4169e1);
            border-radius: 0px;
            border: 1px solid black;
        }
        .buy{
            margin-left: 9px;
            width: 120px;
        }
        .cart{
            width: 120px;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <div class="content">
            <img src="/images/pant2.jpeg" id="pantIcon" alt="pantIcon">
            <h1 ><a href="https://www.hm.com" title="Visit H&M" target="_blank">H&M</a></h1>
            <h4>34/Baggyfit/cotton</h4>
            <button class="buy">Buy</button>
            <button class="cart">Add To Cart</button>
        </div>
    </div>
</body>

</html>
