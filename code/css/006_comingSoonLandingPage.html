<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        
        body,html{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            height: 100%;
        }
        .container{
            background: linear-gradient(90deg, #8a2be2, #4169e1);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
        .content{
            text-align:center;
            background-color: rgba(255,255,255,0.9);
            padding: 2rem;
            border-radius: 15px;
            max-width: 400px;
        }
        .logo{
            width: 150px;
            object-fit: contain;
        }
        h1{
            color: #333;
            margin-bottom: 0.5rem;
        }
        p{
            color:#666;
            margin-bottom: 20px;
        }
        form{
            display: flex;
            flex-direction: column;
        }
        input[type="email"]{
            padding: 6px;
            margin-bottom: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;

        }
        /* button{
            padding:0.4rem;
            background:linear-gradient(300deg, #8a2be2, #4169e1);
            color:rgb(252, 246, 246);
            border:none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.5s ease-in-out;
        }
        button:hover{
            background:linear-gradient(60deg, #8a2be2,#4169e1);
            border-radius: 0px;
            border: 1px dashed black;
        } */
         button {
            padding: 0.4rem;
            background: linear-gradient(300deg, #8a2be2, #4169e1);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.25);
        }

        button:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 2px 3px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <img src="/images/images.png" class="logo" alt="Company Logo" >
            <h1>Coming Soon!!</h1>
            <p>We are working on our page and will bring the best content to you. Stay Tuned!</p>
            <form id="notify-email">
                <input type="email" placeholder="Enter Your Email" required>
                <button type="submit">Notify Me</button>
            </form>
        </div>
    </div>
</body>
</html>
