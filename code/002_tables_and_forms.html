    <h1>Login Form</h1>
    <form>
        <input type="text">
        <label for="email">
            email:
            <input type="text" name="email">
        </label>
        <label for="Password">
            Password:
            <input type="password" name="Password" id="">
        </label>
        <button type="submit">Login</button>
        <button type="reset">Reset</button>
        <button disabled="disabled">Disabled</button>
    </form>

    <div>
        <h2>Learning form</h2>
        <form>
            <label for="email">
                Email:
                <textarea placeholder="abc@gmail.com" name="email" rows="5" cols="33" id=""></textarea>
            </label>
            <label for="Completed games">
                Basketball: <input type="checkbox" name="Basketball" id="">
                Cricket: <input type="color" name="Cricket" id="">
                Tennis: <input type="radio" name="Tennis" id="">
            </label>
            <label for="Subjects">
                <select name="Subjects" id="">
                    <option value="Maths">Maths</option>
                    <option value="English">English</option>
                    <option value="GK">GK</option>
                    
                </select>
            </label>
            <button type="submit">Submit</button>
        </form>
    </div>
